<!doctype html>
<html>
<head>
  <title>
    hotel #
  </title>
</head>
<body>
  <h1>
    client → server
  </h1>
  <button id="getData">
    get data
  </button>

  <pre id="output"></pre>

  <script>

    document
      .querySelector('#getData')
      .addEventListener(
        'click',
        getData
      );

    async function getData() {

      const response =
        await fetch(
          '/api/hello'
        );

      const data =
        await response.json();

      document
        .querySelector('#output')
        .textContent =
          JSON.stringify(
            data,
            null,
            2
          );

    }

  </script>

<hr>

 <h1>
    client → server
  </h1>
  <button id="sendData">
    send or post data
  </button>

<script>


  document
      .querySelector('#sendData')
      .addEventListener(
        'click',
        sendData
      );


    async function sendData() {

  const student = {
    name: 'Lasagna',
    major: 'CIS'
  };

  const response =
    await fetch(
      '/api/students',
      {
        method:
          'POST',
        headers: {
          'Content-Type':
            'application/json'
        },
        body:
          JSON.stringify(
            student
          )
      }
    );

  const data =
    await response.json();

  console.log(data);

}
</script>

</body>

</html>
