<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Transformers Collection Archive</title>
  <link rel="stylesheet" href="\assets\css\style.css">
</head>

<body>

  <header>
    <h1>Transformers Collection Archive</h1>
    <nav>
      <a href="hotel.html" class="active">Showcase Gallery</a>
      <a href="admin.html">Admin Portal</a>
    </nav>
  </header>

  <main class="container">
    <!-- Faction Filter Bar -->
    <div class="filter-bar">
      <span>Filter by Faction:</span>
      <button class="active-filter" onclick="filterGallery('ALL', this)">All Figures</button>
      <button onclick="filterGallery('Autobot', this)">Autobots</button>
      <button onclick="filterGallery('Decepticon', this)">Decepticons</button>
      <button onclick="filterGallery('Maximal', this)">Maximals</button>
      <button onclick="filterGallery('Predacon', this)">Predacons</button>
    </div>

    <!-- Gallery Card Grid -->
    <div id="galleryGrid" class="card-grid">
      <p class="meta-text">Loading collection from Cybertron Archive...</p>
    </div>
  </main>

  <script>
    let allFigures = [];

    
    const FALLBACK_IMG = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='240'><rect width='100%' height='100%' fill='%230d0f12'/><text x='50%' y='50%' fill='%239aa5b1' font-family='sans-serif' font-size='14' text-anchor='middle'>No Photo Available</text></svg>";

    async function loadShowcase() {
      try {
        const response = await fetch('/api/items');
        allFigures = await response.json();
        renderCards(allFigures);
      } catch (err) {
        document.querySelector('#galleryGrid').innerHTML = '<p>Error loading database items.</p>';
      }
    }

    function renderCards(figures) {
      const grid = document.querySelector('#galleryGrid');
      grid.innerHTML = '';

      if (figures.length === 0) {
        grid.innerHTML = '<p class="meta-text">No figures found. Head to the Admin Portal to seed or add figures!</p>';
        return;
      }

      figures.forEach(item => {
        const faction = item.faction || 'Decepticon'; // Defaults old entries without a faction
        const era = item.series || 'Classic / G1';
        const imgSrc = (item.image && item.image.trim() !== '') ? item.image : FALLBACK_IMG;

        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-img-wrapper">
            <img src="${imgSrc}" alt="${item.name || 'Transformer'}" onerror="this.src='${FALLBACK_IMG}'">
          </div>
          <div class="card-body">
            <div class="card-header">
              <div class="card-title">${item.name || 'Unnamed Unit'}</div>
              <span class="badge ${faction}">${faction}</span>
            </div>
            <p class="meta-text"><strong>Series/Era:</strong> ${era}</p>
            <p class="meta-text"><strong>Alt Mode:</strong> ${item.altMode || 'Unknown'}</p>
            ${item.wikiLink && item.wikiLink.trim() !== '' 
              ? `<a class="wiki-link" href="${item.wikiLink}" target="_blank" rel="noopener">View TFWiki Entry &rarr;</a>` 
              : ''}
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function filterGallery(faction, btnElement) {
      document.querySelectorAll('.filter-bar button').forEach(b => b.classList.remove('active-filter'));
      btnElement.classList.add('active-filter');

      if (faction === 'ALL') {
        renderCards(allFigures);
      } else {
        const filtered = allFigures.filter(item => (item.faction || 'Decepticon') === faction);
        renderCards(filtered);
      }
    }

    
    loadShowcase();
  </script>

</body>
</html>
